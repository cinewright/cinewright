<!-- @dsCard group="Queue" height=230 subtitle="Queue row with progress and ETA" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><style>
body{margin:0;padding:24px;background:var(--surface-000)}
.list{border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}.list .cw-job:last-child{border-bottom:0}</style></head><body>
<div class="list"><div class="cw-job">
  <div class="cw-job__thumb"></div>
  <div><div class="cw-job__title">Harbour at night, dolly in</div><div class="cw-job__meta">LTX-2.3 · local · preview</div></div>
  <div><div class="cw-progress" data-state="run" role="progressbar" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100"><span style="width:62%"></span></div><div class="cw-progress__label"><span>Step 19/30</span><span>62 %</span></div></div>
  <div class="cw-job__eta">00:41</div>
  <button class="cw-btn cw-btn--ghost cw-btn--sm">Cancel</button>
</div><div class="cw-job">
  <div class="cw-job__thumb"></div>
  <div><div class="cw-job__title">Mara, orbit</div><div class="cw-job__meta">Wan 2.2 Q5 · local · batch</div></div>
  <div><div class="cw-progress" data-state="waiting" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"><span style="width:0%"></span></div><div class="cw-progress__label"><span>waiting for GPU</span><span>0 %</span></div></div>
  <div class="cw-job__eta">~06:30</div>
  <button class="cw-btn cw-btn--ghost cw-btn--sm">Move up</button>
</div><div class="cw-job">
  <div class="cw-job__thumb"></div>
  <div><div class="cw-job__title">Factory hall, wide shot</div><div class="cw-job__meta">Wan 2.2 Q5 · gpu-lan-01</div></div>
  <div><div class="cw-progress" data-state="fail" role="progressbar" aria-valuenow="38" aria-valuemin="0" aria-valuemax="100"><span style="width:38%"></span></div><div class="cw-progress__label"><span>OOM at step 12</span><span>38 %</span></div></div>
  <div class="cw-job__eta">–</div>
  <button class="cw-btn cw-btn--secondary cw-btn--sm">Retry</button>
</div></div>
</body></html>
