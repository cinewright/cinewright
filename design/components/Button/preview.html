<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><style>
body{margin:0;padding:24px;background:var(--surface-000)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}</style></head><body>

<div class="row">
  <button class="cw-btn cw-btn--primary"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.5v9l7.5-4.5z" fill="currentColor"/></svg>Generate</button>
  <button class="cw-btn cw-btn--secondary"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>Add host</button>
  <button class="cw-btn cw-btn--ghost">Discard preview</button>
  <button class="cw-btn cw-btn--approve">Approve · €0.84</button>
  <button class="cw-btn cw-btn--danger">Cancel job</button>
</div>
<div class="row">
  <button class="cw-btn cw-btn--primary cw-btn--sm">Calibrate</button>
  <button class="cw-btn cw-btn--secondary cw-btn--sm">Open recipe</button>
  <button class="cw-btn cw-btn--primary" disabled>No model selected</button>
</div>
</body></html>
