# Z-Image Turbo 6B. Source of truth: Wan2GP defaults/z_image.json at the pinned commit
# (38758d3c73366422efcf609abb63cab8385f3552) and the headless probe of that commit.
# Hashes and sizes: Hugging Face API (LFS oid = sha256) for DeepBeepMeep/Z-Image at the revision below,
# cross-checked on 2026-11-22 against the X-Linked-Etag of the download URLs (then on the main branch).
#
# The shared engine files (text encoder, VAE, tokenizer and config files) are in `requires`.
id: z-image-turbo
name: Z-Image Turbo 6B
vendor: Tongyi-MAI
family: Z-Image
# Wan2GP capabilities: text_to_image only (inputs: text, outputs: image).
capabilities: [t2i]
limits:
  # Wan2GP resolution choices for a 1920x1088 pixel budget, VAE block size 16, 4K presets off.
  resolutions: [
    1920x1088, 1088x1920, 1440x1440, 1536x1024, 1024x1536, 1920x832, 832x1920, 2048x768, 1024x1792, 1088x1088,
    1024x1024, 1280x720, 720x1280, 1600x400, 1280x544, 544x1280, 1104x832, 832x1104, 960x960, 960x544,
    544x960, 832x624, 624x832, 720x720, 832x480, 480x832, 672x384, 384x672, 512x512, 576x320,
    320x576, 448x448, 448x256, 256x448, 320x320,
  ]
  max_frames: null
  fps: []
  max_duration_s: null
license:
  # Hugging Face card of Tongyi-MAI/Z-Image-Turbo: license apache-2.0.
  name: Apache-2.0
  url: https://www.apache.org/licenses/LICENSE-2.0
  commercial_use: true
  geo_exclusions: []
quantizations:
  # Wan2GP picks the file by its transformer_quantization setting: bf16 = first URL, int8 = the quanto int8 file.
  - id: bf16
    format: safetensors
    files:
      - name: ZImageTurbo_bf16.safetensors
        url: https://huggingface.co/DeepBeepMeep/Z-Image/resolve/86cb9e4af782847d992630c1f3a1e786a76df4fd/ZImageTurbo_bf16.safetensors
        sha256: 1ef8d2c0d15c5727c3e824d93e259669cdf292e9eb4f9deb9a8c56f7245a2fa0
        size_bytes: 12309879106
  - id: int8
    format: safetensors
    files:
      - name: ZImageTurbo_quanto_bf16_int8.safetensors
        url: https://huggingface.co/DeepBeepMeep/Z-Image/resolve/86cb9e4af782847d992630c1f3a1e786a76df4fd/ZImageTurbo_quanto_bf16_int8.safetensors
        sha256: dd4b9172c0c4d69aa6d03a61f5be56c5fee5a9bc4ce1fcca5fc8633cec78d850
        size_bytes: 6886911511
# Shared engine files every quantization needs (registry/shared/). The text encoder file follows Wan2GP's
# text_encoder_quantization setting, not the quantization above.
requires: [z-image-shared]
prompt_dialect:
  style: natural
  notes: Describe the finished image in plain sentences, including subject, composition, setting and lighting.
defaults:
  # Wan2GP default settings for z_image.
  steps: 8
  guidance: 0
  resolution: 1024x1024
# Ranks first among t2i models of equal cost: it is made for images, while LTX-2.3 and Wan 2.2 T2V render a short
# clip in image mode and keep its first frame. Z-Image offers only t2i, so no other capability is affected.
preference: 1
source:
  provider: huggingface
  repo: DeepBeepMeep/Z-Image
  revision: 86cb9e4af782847d992630c1f3a1e786a76df4fd
engines:
  - {engine: wan2gp, model_type: z_image, quant: bf16}
  - {engine: wan2gp, model_type: z_image, quant: int8}
