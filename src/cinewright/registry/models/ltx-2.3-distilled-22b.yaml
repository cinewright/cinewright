# Shared engine files every quantization needs (registry/shared/). The text encoder file follows Wan2GP's
# text_encoder_quantization setting, not the quantization above.
requires: [ltx-2.3-22b-shared]
prompt_dialect:
  style: natural
  notes: Describe the scene in chronological order, including camera moves, spoken lines and sounds; the soundtrack follows the prompt.
defaults:
  # Wan2GP default settings for ltx2_22B_distilled. The distilled pipeline locks the 8-step schedule
  # (lock_inference_steps); guidance is left to Wan2GP. Its default 1280x720 is aligned to 1280x704 (VAE block 64).
  steps: 8
  resolution: 1280x704
  frames: 241
  fps: 24
