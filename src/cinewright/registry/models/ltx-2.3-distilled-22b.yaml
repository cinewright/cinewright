# LTX-2 2.3 Distilled 1.0 22B. Source of truth: Wan2GP defaults/ltx2_22B_distilled.json and
# defaults/ltx2_22B_distilled_gguf_{q4_k_m,q6_k,q8_0}.json at the pinned commit
# (38758d3c73366422efcf609abb63cab8385f3552) and the headless probe of that commit.
# Hashes and sizes: Hugging Face API (LFS oid = sha256) for DeepBeepMeep/LTX-2 at the revision below,
# cross-checked on 2026-11-22 against the X-Linked-Etag of the download URLs (then on the main branch).
#
# The shared engine files (text encoder, VAEs, vocoder, connectors, upscalers, preload file) are in `requires`.
# IC-LoRAs (union control, outpaint, inpaint, ingredients, HDR, ID voice) are fetched on demand by Wan2GP and not pinned.
id: ltx-2.3-distilled-22b
name: LTX-2 2.3 Distilled 1.0 22B
vendor: Lightricks
family: LTX-2
# Wan2GP capabilities: text_to_video, image_to_video, text_to_image, image_to_image, audio_output (soundtrack
# generated with the video). Wan2GP also reports video_to_video / control video, not mapped yet.
capabilities: [t2v, i2v, t2i, i2i, audio]
limits:
  # Wan2GP resolution choices for a 1920x1088 pixel budget, aligned to VAE block size 64, 4K presets off.
  resolutions: [
    1920x1088, 1088x1920, 1408x1408, 1536x1024, 1024x1536, 1920x832, 832x1920, 2048x768, 1024x1792, 1088x1088,
    1024x1024, 1280x704, 704x1280, 1600x384, 1280x512, 512x1280, 1088x832, 832x1088, 960x960, 960x512,
    512x960, 832x576, 576x832, 704x704, 832x448, 448x832, 640x384, 384x640, 512x512, 576x320,
    320x576, 448x448, 448x256, 256x448, 320x320,
  ]
  # Wan2GP frame slider maximum for sliding-window models (737). Frame counts are 17 + 8n.
  max_frames: 737
  fps: [24]
  # 737 frames / 24 fps, rounded down.
  max_duration_s: 30.7
license:
  # Hugging Face card of Lightricks/LTX-2.3: license other, license_name ltx-2-community-license-agreement.
  # Entities with annual revenue of USD 10 million or more need a paid commercial licence, so commercial use
  # needs a case-by-case reading. Section 7 (export controls and sanctions) names no countries.
  name: LTX-2 Community License Agreement
  url: https://github.com/Lightricks/LTX-2/blob/main/LICENSE-2
  commercial_use: null
  geo_exclusions: []
