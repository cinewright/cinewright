# Input for the Wan2GP engine lock (pylock.win_amd64.toml next to this file). Not a Cinewright package.
#
# `dependencies` is upstream requirements.txt at the commit pinned in ../engines.yaml, line by line, with two changes:
# - upstream's global `--extra-index-url` (the onnxruntime CUDA 13 nightly feed) is dropped; onnxruntime-gpu alone
#   comes from that feed, through the explicit index and the source below;
# - torch, torchvision and torchaudio are added at the versions of `torch` in engines.yaml, from `torch_index` only.
#   Upstream installs them in a separate step; requirements.txt only pulls torch in transitively.
# An explicit index serves only the packages that name it in [tool.uv.sources]; everything else comes from PyPI.
# How to regenerate the lock: src/cinewright/registry/README.md, section "Engine pins".

[project]
name = "cinewright-wan2gp-environment"
version = "0"
requires-python = "==3.11.*"
dependencies = [
    # PyTorch, from torch_index (see [tool.uv.sources]).
    'torch==2.10.0',
    'torchvision==0.25.0',
    'torchaudio==2.10.0',
    # Upstream requirements.txt from here on.
    # mmgp is bundled in the mmgp folder; its dependencies:
    'optimum-quanto==0.2.7',
    'safetensors',
    'psutil',
    'filelock',
    'comfy-kitchen==0.2.35',
    # Core AI stack
    'diffusers==0.36.0',
    'transformers==4.54.0',
    'tokenizers>=0.20.3',
    'accelerate>=1.1.1',
    'tqdm',
    'imageio',
    'imageio-ffmpeg',
    'einops',
    'rotary-embedding-torch>=0.5.3',
    'sentencepiece',
    'tiktoken',
    'fugashi>=1.2.0',
    'unidic-lite>=1.0.0',
    'open_clip_torch>=2.29.0',
    'numpy==2.1.2',
    'num2words==0.5.14',
    # Video & media
    'moviepy==1.0.3',
    'av',
    'ffmpeg-python',
    'pygame>=2.1.0',
    'sounddevice>=0.4.0',
    'soundfile',
    'mutagen',
    'pyloudnorm',
    'librosa==0.11.0',
    'speechbrain==1.0.3',
    'openai-whisper==20250625',
    'audio-separator==0.36.1',
    'pyannote.audio==3.3.2',
    'sherpa-onnx==1.13.2',
    'torchcodec==0.10.0',
    'einshape==1.0',
    'jax',
    # UI & interaction
    'gradio==5.29.0',
    'orjson==3.11.6',
    'dashscope',
    'loguru',
    's3tokenizer',
    'conformer==0.3.2',
    'spacy_pkuseg',
    'spacy',
    'gradio_rangeslider',
    # Vision & segmentation
    'opencv-python>=4.12.0.88',
    'ultralytics',
    'scipy',
    'pycocotools',
    'segment-anything',
    'rembg[gpu]==2.0.65; platform_system != "Darwin"',
    'rembg==2.0.65; platform_system == "Darwin"',
    'onnxruntime-gpu==1.22.0; python_version < "3.11" and platform_system != "Darwin"',
    'onnxruntime-gpu==1.25.0.dev20260210001; python_version >= "3.11" and platform_system != "Darwin"',
    'onnxruntime>=1.22.0; platform_system == "Darwin"',
    'decord; sys_platform == "win32"',
    'decord @ https://github.com/deepbeepmeep/kernels/releases/download/decord/decord-0.6.0%2Bwheeltag-py3-none-manylinux2010_x86_64.whl ; sys_platform == "linux"',
    'timm',
    'iopath>=0.1.10',
    'insightface @ https://github.com/deepbeepmeep/insightface/releases/download/insightface/insightface-0.7.3-cp310-cp310-win_amd64.whl ; sys_platform == "win32" and python_version == "3.10"',
    'insightface @ https://github.com/deepbeepmeep/insightface/releases/download/insightface/insightface-0.7.3-cp311-cp311-win_amd64.whl ; sys_platform == "win32" and python_version == "3.11"',
    'insightface @ https://github.com/deepbeepmeep/insightface/releases/download/insightface/insightface-0.7.3-cp312-cp312-win_amd64.whl ; sys_platform == "win32" and python_version == "3.12"',
    'insightface==0.7.3 ; sys_platform == "linux"',
    'facexlib==0.3.0',
    'taichi',
    'vector_quantize_pytorch==1.27.19',
    # 3D meshes (UV unwrapping, decimation, marching cubes)
    'xatlas>=0.0.11',
    'fast-simplification>=0.2.0',
    'scikit-image==0.25.2; python_version < "3.11"',
    'scikit-image>=0.26.0; python_version >= "3.11"',
    # Deepy (SVG, web search, PDF, screenshots)
    'resvg-py==0.5.0',
    'ddgs>=9.16.0',
    'pypdf>=6.0.0',
    'playwright>=1.48',
    # chumpy wheel hosted on GitHub to avoid sdist build isolation issue
    'chumpy @ https://github.com/deepbeepmeep/chumpy/releases/download/v0.71/chumpy-0.71-py3-none-any.whl',
    'smplfitter @ https://github.com/deepbeepmeep/smplfitter/releases/download/v0.2.10/smplfitter-0.2.10-py3-none-any.whl',
    # Config & orchestration
    'omegaconf',
    'hydra-core',
    'easydict',
    'pydantic==2.11.10',
    'mcp==1.30.0',
    # Math & modeling
    'mir_eval==0.8.2',
    'pretty_midi==0.2.11.post0',
    'mido==1.3.3',
    'symusic==0.6.0',
    'torchdiffeq>=0.2.5',
    'peft==0.17.0',
    'vector-quantize-pytorch',
    'matplotlib',
    'gguf==0.17.1',
    'flash-linear-attention==0.4.1',
    # Utilities
    'ftfy',
    'piexif',
    'nvidia-ml-py',
    'misaki',
    'gitdb==4.0.12',
    'gitpython==3.1.45',
    'stringzilla==4.0.14',
    'xxhash',
    'munch',
    'wetext==0.1.2',
    'markdown',
    'apprise==1.12.0',
    'keyring==25.7.0',
    'huggingface_hub[hf_xet]',
    'hf_xet>=1.5.2',
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "onnxruntime-cuda-13-nightly"
url = "https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/ort-cuda-13-nightly/pypi/simple/"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
onnxruntime-gpu = { index = "onnxruntime-cuda-13-nightly" }
