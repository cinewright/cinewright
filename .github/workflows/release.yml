# Releases from main with release-please (Conventional Commits: fix -> patch, feat -> minor before 1.0).
# release-please keeps a release PR open on main; the owner merges it to release. That merge's push
# creates the GitHub release and tag, then the publish job builds the Windows installer, attests its
# build provenance and uploads it to the release.
# The release PR is never merged automatically: a merge by GITHUB_TOKEN would not trigger this workflow.
name: release
on:
  push:
    branches: [main]
permissions: {}
jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-release-please
      cancel-in-progress: false
    permissions:
      contents: write # release commits, tags and GitHub releases
      pull-requests: write # the release PR
      issues: write # release PR labels ("autorelease: pending" / "tagged"), as release-please-action documents
      actions: write # start CI on the release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - name: release-please
        id: rp
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # A PR that GITHUB_TOKEN created or updated triggers no workflows, so start CI on its head
      # branch; the run's "ci" check lands on the PR's head commit.
      - name: Start CI on the release PR
        if: steps.rp.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_JSON: ${{ steps.rp.outputs.pr }}
        run: |
          branch="$(jq -r '.headBranchName' <<<"$PR_JSON")"
          if [ -z "$branch" ] || [ "$branch" = "null" ]; then
            echo "::error::release-please reported a PR without a head branch"
            exit 1
          fi
          gh workflow run ci.yml --ref "$branch"

  publish:
    name: publish
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write # release assets
      id-token: write # attestations
      attestations: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - name: Setup
        run: python -m pip install -e ".[dev]"
      - name: Build
        run: python scripts/build.py
      - name: Version smoke test (reports the released version)
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          actual="$(python -m cinewright --version)"
          if [ "$actual" != "cinewright $VERSION" ]; then
            echo "::error::python -m cinewright --version printed '$actual', expected 'cinewright $VERSION'"
            exit 1
          fi
          echo "$actual"
      - name: Artifact attestation
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: dist/CinewrightSetup-*.exe
      - name: Upload the installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          shopt -s nullglob
          files=(dist/CinewrightSetup-*.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::the build produced no dist/CinewrightSetup-*.exe"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
