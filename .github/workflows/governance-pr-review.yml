# Managed by nullthrone/governance. Do not edit: changes come only from the owner via onboarding.
# The owner's approval decides external contributions and candidate acceptance.
name: governance-pr-review
on:
  pull_request_review:
    types: [submitted, dismissed]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  gate:
    uses: nullthrone/governance/.github/workflows/external-contribution-gate.yml@2b802b86340a3c527f3e8bd42c0c0c6d2173dd2b
    permissions:
      contents: read
      pull-requests: read
