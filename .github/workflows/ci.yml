# CI for pull requests to main and pushes to main. The job's check "ci" is the required check.
# workflow_dispatch: release.yml starts this workflow on the release-please PR branch as an early signal
# (GitHub does not count that run for the PR's required check; the owner closes and reopens the release
# PR to get one that counts). It can also be started by hand.
# Every green run uploads the Windows installer as the artifact "installer", so a build can be tested
# before it is released (Actions -> the run -> Artifacts).
name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - name: Setup
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check src tests
      # Builds the web UI (npm ci, tsc --noEmit, vite build), the wheel, the lock and the installer
      # (installs NSIS with apt-get). Runs before the tests: pytest skips the web tests without web/node_modules.
      - name: Build
        run: python scripts/build.py
      - name: Test
        run: pytest -q
      - name: Version smoke test (reports the version in .release-please-manifest.json)
        run: |
          expected="$(python -c 'import json; print(json.load(open(".release-please-manifest.json", encoding="utf-8"))["."])')"
          actual="$(python -m cinewright --version)"
          if [ "$actual" != "cinewright $expected" ]; then
            echo "::error::python -m cinewright --version printed '$actual', expected 'cinewright $expected'"
            exit 1
          fi
          echo "$actual"
      - name: Semgrep (blocking on ERROR severity)
        run: pipx run semgrep scan --config p/default --severity ERROR --error --metrics off
      - name: Upload the installer for testing
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: installer
          path: dist/CinewrightSetup-*.exe
          if-no-files-found: error
          retention-days: 14
