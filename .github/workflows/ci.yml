# CI for pull requests to main and pushes to main. The job's check "ci" is the required check.
# workflow_dispatch lets release.yml start CI on the release-please PR: pull requests that
# GITHUB_TOKEN creates or updates trigger no workflows.
name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - name: Setup
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check src tests
      # Builds the web UI (npm ci, tsc --noEmit, vite build), the wheel, the lock and the installer
      # (installs NSIS with apt-get). Runs before the tests: pytest skips the web tests without web/node_modules.
      - name: Build
        run: python scripts/build.py
      - name: Test
        run: pytest -q
      - name: Version smoke test (reports the version in .release-please-manifest.json)
        run: |
          expected="$(python -c 'import json; print(json.load(open(".release-please-manifest.json", encoding="utf-8"))["."])')"
          actual="$(python -m cinewright --version)"
          if [ "$actual" != "cinewright $expected" ]; then
            echo "::error::python -m cinewright --version printed '$actual', expected 'cinewright $expected'"
            exit 1
          fi
          echo "$actual"
      - name: Semgrep (blocking on ERROR severity)
        run: pipx run semgrep scan --config p/default --severity ERROR --error --metrics off
